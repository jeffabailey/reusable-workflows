name: Hugo Deploy

on:
  workflow_call:
    inputs:
      website_repository:
        required: false
        type: string
      s3_bucket_name:
        required: true
        type: string
      cloudfront_distribution_id:
        required: true
        type: string
      browser_tests:
        description: >-
          Run the caller's Playwright suite against the live site after the
          CloudFront invalidation. Skipped automatically when the repository has
          no tests/browser/package.json, so sites without a suite need change
          nothing. Set false to opt out even when the suite exists.
        required: false
        type: boolean
        default: true
      browser_tests_url:
        description: >-
          Base URL the suite runs against, for example https://jeffbailey.us.
          Left empty, the suite falls back to the baseURL in its own
          playwright.config.
        required: false
        type: string
        default: ''
      hugo_version:
        description: >-
          Hugo version to build with, e.g. "0.164.0". Callers should pass the
          version their own site requires: templates can depend on Hugo APIs
          introduced in a specific release, so a stale pin fails the build.
          Defaults to "latest".
        required: false
        type: string
        default: 'latest'
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      access_token:
        required: true

jobs:
  deploywebsite:
    name: "Deploy Website"
    runs-on: ubuntu-latest

    # Hugo's own cache dir (for modules / remote resources)
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: us-east-1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.website_repository || github.repository }}
          token: ${{ secrets.access_token }}
          fetch-depth: 1
          submodules: recursive

      # Load env vars from .env (same as before)
      - name: Simple Dotenv
        uses: xom9ikk/dotenv@v2.4.0
        with:
          path: ./

      - name: Set Default Git Branch
        run: git config --global init.defaultBranch main

      # Version comes from the caller (see the hugo_version input), so each site
      # builds with the Hugo its own templates require instead of a pin held
      # here on every consumer's behalf.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: true

      - name: Get Hugo version
        id: hugo-version
        working-directory: ./hugo
        run: |
          HUGO_VERSION=$(hugo version | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "latest")
          echo "version=$HUGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ./hugo
        timeout-minutes: 15
        run: hugo --minify --gc

      - name: List Built Files
        run: find ./hugo/public -type f | sort

      - name: Convert JSONC to JSON
        run: |
          if [ -d ./hugo/data ]; then
            find ./hugo/data -name '*.jsonc' -exec sh -c 'npx -y json5 -s 2 "$1" > "${1%.jsonc}.json"' _ {} \;
          fi

      # Two cache classes. Documents keep their URL when their content changes
      # (HTML, feeds, sitemaps, llm.txt, JSON), so browsers may hold them only
      # briefly; a year-long max-age showed returning readers stale menus and
      # stale fix instructions. CloudFront still caches them for a year via
      # s-maxage, because every deploy invalidates /* below. Everything else is
      # fingerprinted by Hugo or rarely replaced, and keeps the year-long cache.
      - name: S3 Sync
        env:
          ASSET_CACHE: max-age=31536000,public
          DOCUMENT_CACHE: public,max-age=300,s-maxage=31536000
        run: |
          aws s3 sync ./hugo/public s3://${{ inputs.s3_bucket_name }} \
            --acl public-read \
            --cache-control "$ASSET_CACHE" \
            --exclude '*.html' --exclude '*.xml' --exclude '*.txt' --exclude '*.json' --exclude '*.webmanifest' \
            --only-show-errors
          aws s3 sync ./hugo/public s3://${{ inputs.s3_bucket_name }} \
            --acl public-read \
            --cache-control "$DOCUMENT_CACHE" \
            --exclude '*' \
            --include '*.html' --include '*.xml' --include '*.txt' --include '*.json' --include '*.webmanifest' \
            --only-show-errors
          if [ -d ./hugo/data ]; then
            aws s3 sync ./hugo/data s3://${{ inputs.s3_bucket_name }}/data \
              --acl public-read \
              --cache-control "$DOCUMENT_CACHE" \
              --only-show-errors
            aws s3 sync ./hugo/data s3://${{ inputs.s3_bucket_name }}/data \
              --acl public-read \
              --cache-control "$DOCUMENT_CACHE" \
              --exclude '*' --include '*.json' \
              --content-type application/json \
              --only-show-errors
            aws s3 sync ./hugo/data s3://${{ inputs.s3_bucket_name }}/data \
              --acl public-read \
              --cache-control "$DOCUMENT_CACHE" \
              --exclude '*' --include '*.jsonc' \
              --content-type application/jsonc \
              --only-show-errors
          fi

      - name: Cloudfront Invalidate
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ inputs.cloudfront_distribution_id }} \
            --paths "/*"

      # Post-deploy smoke tests. The invalidation above is what makes them
      # meaningful: they run against the live site, after the new objects are
      # served, so they catch what a build cannot (redirects at the edge,
      # response headers, rendered DOM, layout at phone width).
      #
      # A failure here does not roll the deploy back: the objects are already in
      # S3. It fails the workflow so the break is visible immediately instead of
      # in Search Console weeks later.
      - name: Check for a browser test suite
        id: browser-suite
        if: ${{ inputs.browser_tests }}
        run: |
          if [ -f tests/browser/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No tests/browser/package.json; skipping browser tests."
          fi

      # No npm cache: tests/browser/package-lock.json is gitignored in at least
      # one consumer, and setup-node fails when the cache-dependency-path does
      # not exist.
      - name: Set up Node
        if: ${{ steps.browser-suite.outputs.present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        if: ${{ steps.browser-suite.outputs.present == 'true' }}
        working-directory: ./tests/browser
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium

      - name: Run browser tests against the live site
        if: ${{ steps.browser-suite.outputs.present == 'true' }}
        working-directory: ./tests/browser
        timeout-minutes: 10
        env:
          BASE_URL: ${{ inputs.browser_tests_url }}
        run: npx playwright test

      - name: Upload browser test report
        if: ${{ failure() && steps.browser-suite.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 7

      - name: Cleanup
        uses: rtCamp/action-cleanup@master
